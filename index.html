<!DOCTYPE html>
<html lang="pt-BR" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a1c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="application-name" content="Picly"><meta name="apple-mobile-web-app-title" content="Picly">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://tonnuwutwbohlpapvcri.supabase.co" crossorigin>
<title>Picly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050a1c;--navy:#0a1330;--navy2:#0d1a40;--card:#0a1331;--ink:#eef2ff;--mut:#8e9bbd;--line:rgba(120,160,255,.15);--acc:#2563eb;--accl:#6c9cff;--glow:#2f66f0;--ok:#22c55e;--okbg:rgba(34,197,94,.14);--ok2:rgba(34,197,94,.07);--ok2l:rgba(34,197,94,.45);--no:#ef4444;--nobg:rgba(239,68,68,.14);
--hf:'Varela Round','Inter',system-ui,sans-serif;--bf:'Lato','Inter',-apple-system,system-ui,sans-serif;
--glowbg:radial-gradient(140% 85% at 50% 120%,rgba(52,110,255,1) 0%,rgba(37,99,235,.5) 38%,rgba(37,99,235,0) 74%),linear-gradient(180deg,#0c1738,#08102a);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(820px 460px at 50% -140px,rgba(37,99,235,.30),transparent 70%) no-repeat top center,var(--bg)}
body{background:transparent;color:var(--ink);font-family:var(--bf);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h3,.q,.big,.wm,.exam b{font-family:var(--hf);font-weight:400}
h1{font-size:clamp(28px,5.5vw,40px);line-height:1.12;margin:6px 0 8px;letter-spacing:-.01em}
p.sub,.sub{color:var(--mut);margin:0 0 26px;line-height:1.5}
.logo{display:block;width:150px;height:auto;margin:8px 0 4px}

/* ---------- layout ---------- */
.shell{max-width:1120px;margin:0 auto;padding:14px 16px 48px}
main{min-width:0;padding:26px 4px 20px}
.view{animation:in .35s ease both}
.view:not(.wide){max-width:720px;margin:0 auto}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- barra flutuante em pílula ---------- */
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 10px 9px 22px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(30,56,128,.55),rgba(10,19,48,.96));box-shadow:0 10px 30px -18px rgba(37,99,235,.8)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hf);font-size:17px;letter-spacing:.22em;flex:none}
.brand .logo{width:42px;margin:0}
#nav{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
#nav::-webkit-scrollbar{display:none}
.ni{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:999px;padding:9px 15px;color:var(--mut);font-size:14px;font-weight:700;white-space:nowrap;transition:background .2s,color .2s}
.ni svg{display:none;width:22px;height:22px;flex:none}
.ni:hover{color:var(--ink)}
.ni.on{color:#fff;background:rgba(108,156,255,.18)}
.who{display:flex;align-items:center;gap:10px;flex:none}
.wn{color:var(--mut);font-size:13px}
.who .ni{background:#e8eeff;color:#0a1330;padding:10px 20px;box-shadow:inset 0 -2px 0 rgba(37,99,235,.18)}
.who .ni:hover{background:#fff;color:#0a1330}

/* ---------- cards (bento) ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.exam{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;width:100%;min-height:176px;text-align:left;padding:22px;border-radius:26px;border:1px solid var(--line);background:var(--glowbg);transition:transform .25s ease,border-color .25s}
.exam::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 125%,transparent 0 36%,rgba(96,145,255,.34) 36.5% 37.2%,transparent 37.7% 56%,rgba(96,145,255,.22) 56.5% 57.2%,transparent 57.7%)}
.exam>*{position:relative}
.exam:hover{transform:translateY(-3px);border-color:rgba(140,175,255,.4)}
.exam:active{transform:scale(.985)}
.exam b{display:block;font-size:21px;line-height:1.2}
.exam span{color:#a9b6d8;font-size:14px}
.exam .fico{margin-bottom:auto}
.fico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#07102b;border:1px solid rgba(140,175,255,.35);box-shadow:0 0 22px -4px rgba(47,102,240,.8)}
.fico svg{width:28px;height:28px;color:#fff}
.view:not(.wide) .exam{min-height:0;flex-direction:row;justify-content:center;align-items:center;padding:17px;margin-bottom:12px;background:var(--card)}
.view:not(.wide) .exam::before{display:none}
.stat,.card,.sec,.qc{border:1px solid var(--line);background:var(--glowbg);border-radius:26px}
.stat{position:relative;padding:20px 22px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.stat b{font-family:var(--hf);font-weight:400;font-size:46px;line-height:1}
.stat span{color:#a9b6d8;font-size:14px;order:-1}
.card{padding:22px;margin-top:16px;background:radial-gradient(120% 30% at 50% 122%,rgba(47,102,240,.5),transparent 70%),linear-gradient(180deg,#0c1738,#08102a)}.card h3{margin:0 0 12px;font-size:18px}.card svg{width:100%;height:auto}
.br{display:grid;grid-template-columns:minmax(110px,38%) 1fr 34px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.tr{height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.tr i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--accl));border-radius:9px}.br b{text-align:right}
.sec{padding:6px 18px;margin:18px 0;background:var(--card)}
.sec div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.sec div:last-child{border:0}

/* ---------- botões ---------- */
.next{display:block;width:100%;margin-top:16px;background:#e8eeff;color:#0a1330;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:700;box-shadow:0 10px 26px -12px rgba(120,165,255,.9);transition:transform .2s,background .2s}
.next:hover{background:#fff}.next:active{transform:scale(.97)}
.next.skip{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.prev{flex:none;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:14px 20px;font-size:15px;transition:opacity .2s,border-color .2s}
.prev:hover:not(:disabled){border-color:rgba(140,175,255,.45)}.prev:disabled{opacity:.4;cursor:default}
.back{background:none;border:0;color:var(--mut);font-size:15px;padding:6px 0}.back:hover{color:var(--ink)}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px}.crumb .back{padding:0}

/* ---------- prova ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--accl));border-radius:9px;transition:width .5s ease}
.cnt{font-size:14px;color:var(--mut);min-width:48px;text-align:right}
.tema{color:var(--accl);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.q{font-size:clamp(20px,4.6vw,26px);line-height:1.4;margin:0 0 22px}
.q img{display:block;max-width:100%;border-radius:14px;margin-top:12px}
.fig{display:flex;justify-content:center;margin:0 0 18px}.fig svg{width:100%;max-width:300px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;font-size:17px;transition:background .25s,border-color .25s,opacity .25s}
.opt em{flex:none;width:34px;height:34px;border-radius:50%;background:#07102b;border:1px solid rgba(140,175,255,.3);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700;transition:background .25s,border-color .25s}
.opt:not(:disabled):hover{border-color:rgba(140,175,255,.5);background:rgba(47,102,240,.14)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);animation:pop .4s}.opt.ok em{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no);animation:shake .35s}.opt.no em{background:var(--no);border-color:var(--no);color:#fff}
.opt.rev{background:var(--ok2);border-color:var(--ok2l)}.opt.dim{opacity:.5}
@keyframes pop{50%{transform:scale(1.02)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}.exp.on{grid-template-rows:1fr}.exp>div{overflow:hidden}
.exp .in{margin-top:6px;background:var(--glowbg);border:1px solid var(--line);border-left:4px solid var(--accl);border-radius:20px;padding:18px;line-height:1.55;opacity:0;transform:translateY(-6px);transition:opacity .35s .1s,transform .35s .1s}
.exp.on .in{opacity:1;transform:none}.exp b{display:block;margin-bottom:4px}
.nav{position:sticky;bottom:16px;z-index:20;display:flex;gap:10px;margin-top:18px;padding:8px;border-radius:999px;border:1px solid var(--line);background:rgba(8,15,38,.96)}
.nav .next{margin-top:0;flex:1;width:auto;box-shadow:none}
.big{font-size:84px;line-height:1;margin:12px 0;color:var(--accl)}.big small{font-size:24px;color:var(--mut);margin-left:6px}
.msg{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);border-radius:20px;padding:15px 18px;font-weight:700;line-height:1.45;margin:6px 0 4px;animation:in .4s .25s both}
.map{margin-top:22px;color:var(--mut)}.map summary{cursor:pointer;padding:8px 0;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:8px;margin-top:8px}
.chip{height:42px;border-radius:50%;border:1px solid var(--line);background:#07102b;font-size:14px;color:var(--ink)}
.chip.ok{background:var(--okbg);border-color:var(--ok)}.chip.no{background:var(--nobg);border-color:var(--no)}.chip.sk{border:1px dashed #f59e0b;color:#f59e0b}.chip.cur{border-color:var(--accl);box-shadow:0 0 0 2px var(--accl)}
.still,.still *{animation:none!important}.still .exp,.still .exp .in{transition:none!important}

/* ---------- formulários ---------- */
input,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:14px 16px;color:var(--ink);font:inherit;margin-bottom:10px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--accl);box-shadow:0 0 0 3px rgba(108,156,255,.18)}
textarea{min-height:70px;resize:vertical}
.qc{padding:16px;margin:12px 0;background:var(--card)}.qc input,.qc textarea{background:rgba(0,0,0,.25);margin-bottom:8px}
.row{display:flex;gap:8px;margin:10px 0}.er{color:var(--no);margin:4px 0 0}
:focus-visible{outline:2px solid var(--accl);outline-offset:2px}

/* ---------- login ---------- */
.hero{display:grid;justify-items:center;gap:8px;text-align:center;margin:6px 0 22px}.hero .logo{width:110px;margin:0}
.wm{font-size:34px;letter-spacing:.3em;padding-left:.3em}.tag{font-size:11px;letter-spacing:.3em;color:var(--mut)}
.auth .side{display:none}.auth .shell{max-width:440px}
.auth main{padding-top:6vh}
.auth main .view{background:var(--glowbg);border:1px solid var(--line);border-radius:30px;padding:30px 22px}




.challenge-pick{display:grid;gap:10px;margin:12px 0 16px}.challenge-pick .exam{min-height:0;min-height:88px;padding:16px;border-radius:20px}.challenge-pick .exam b{font-size:17px}.challenge-pick .exam span{font-size:13px}.challenge-crumb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px;margin:8px 0 14px}.challenge-crumb button{background:none;border:0;color:var(--accl);padding:0;font:inherit}.challenge-choice{border:1px solid rgba(108,156,255,.42);border-radius:20px;padding:16px;background:rgba(37,99,235,.12);margin:12px 0 16px}.challenge-choice b{display:block;font-family:var(--hf);font-size:20px;margin-bottom:4px}.challenge-choice span{color:#a9b6d8;font-size:14px}

.install-app{display:flex!important;align-items:center;gap:7px;color:var(--ink)!important;background:rgba(108,156,255,.16)!important;border:1px solid rgba(108,156,255,.35)!important;padding:9px 13px!important;font-size:13px!important}.install-app svg{width:17px;height:17px}.install-app[hidden]{display:none!important}
@media(max-width:820px){.install-app{display:none!important}}

/* ---------- desafios individuais ---------- */
.challenge-btn{flex:none;padding:9px 13px!important;font-size:13px!important;color:var(--accl)!important;border-color:rgba(108,156,255,.4)!important}
.challenge-card{width:min(340px,88%);padding:14px 16px;border:1px solid rgba(108,156,255,.42);border-radius:20px;background:linear-gradient(145deg,rgba(37,99,235,.22),rgba(10,19,48,.96));line-height:1.4}
.bub.me .challenge-card{margin-left:auto}.challenge-card b{display:block;font-family:var(--hf);font-size:18px;margin-bottom:4px}.challenge-card small{display:block;color:#a9b6d8;margin-bottom:10px}.challenge-card .prev,.challenge-card .next{width:100%;margin:0;padding:11px 14px}.challenge-card .next{margin-top:8px}
.chq{font-size:clamp(20px,4.6vw,26px);line-height:1.4;margin:0 0 20px}.chtimer{color:var(--accl);font-size:14px;font-weight:700;white-space:nowrap}.challenge-result{border:1px solid var(--line);border-radius:24px;background:var(--glowbg);padding:20px;margin:16px 0}.challenge-result h3{margin:0 0 8px}.challenge-result strong{font-size:28px;color:var(--accl)}
.qpick input{margin-top:6px}.qp img,.fig img{display:block;max-width:100%;max-height:260px;object-fit:contain;border-radius:16px}
@media(max-width:820px){.challenge-btn{padding:8px 10px!important;font-size:12px!important}.chhead .ch{min-width:0}.chhead .ch+button{max-width:88px}.challenge-card{width:94%}}

/* ---------- melhorias da tela inicial e mobile ---------- */
.home-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.home-stats .stat{min-width:0;padding:18px 16px}
.home-stats .stat b{font-size:40px}
.home-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.quick{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:176px;padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(37,99,235,.3),rgba(10,19,49,.94));overflow:hidden}
.quick h3{margin:0 0 6px;font-size:20px}.quick p{margin:0;color:#a9b6d8;line-height:1.45;font-size:14px}.quick .prev,.quick .next{width:100%;margin:0}.quick .qtop{display:flex;align-items:flex-start;gap:12px}.quick .fico{width:44px;height:44px;flex:none}.quick .fico svg{width:23px;height:23px}
.home-kicker{display:block;color:var(--accl);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
@media(max-width:820px){
 body{overflow-x:hidden}
 main{padding-left:0;padding-right:0}
 .pban{height:138px;border-radius:22px}
 .phead{gap:10px;margin-top:-38px}
 .phead h1{font-size:clamp(23px,7vw,30px);margin-bottom:2px}
 .phead .av{width:76px!important;height:76px!important;font-size:29px!important}
 .home-stats{gap:8px}
 .home-stats .stat{padding:15px 10px;border-radius:20px}
 .home-stats .stat b{font-size:clamp(25px,8vw,36px)}
 .home-stats .stat span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .home-tools{grid-template-columns:1fr;gap:12px}
 .quick{min-height:0;padding:18px;border-radius:22px}
 .quick .prev,.quick .next{padding:13px 14px}
 .hl{padding:16px;gap:12px;border-radius:22px}
 .hl b{font-size:19px}
}
@media(max-width:360px){.home-stats .stat{padding-left:7px;padding-right:7px}.home-stats .stat span{font-size:11px}.home-stats .stat b{font-size:26px}}

/* ---------- celular ---------- */
@media(max-width:820px){
  .shell{padding:10px 12px 0}
  main{padding:14px 2px 140px}
  .brand,.wn{display:none}
  .side{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:7px;gap:4px;background:rgba(10,19,48,.97);box-shadow:0 -6px 22px -10px rgba(0,0,0,.9)}
  #nav{justify-content:flex-start}
  .ni{flex-direction:column;gap:3px;font-size:10px;padding:8px 12px;border-radius:20px}
  .ni svg{display:block}
  .who .ni{padding:10px 14px;font-size:12px}
  .nav{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .grid2{grid-template-columns:1fr 1fr;gap:12px}
  .exam{min-height:150px;padding:18px;border-radius:24px}.exam b{font-size:18px}
  .view:not(.wide) .exam{padding:15px}
  .stat b{font-size:38px}
  .big{font-size:68px}
}
@media(max-width:400px){.grid2{grid-template-columns:1fr}}


/* senha + treino */
.pw{position:relative;margin-bottom:10px}.pw input{margin:0;padding-right:56px}
.eye{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:none;color:var(--mut);display:grid;place-items:center}
.eye:hover{color:var(--ink);background:rgba(255,255,255,.06)}.eye svg{width:22px;height:22px}
.prac{display:inline-block;margin:-6px 0 14px;padding:6px 14px;border-radius:999px;border:1px dashed #f59e0b;color:#f59e0b;font-size:13px;font-weight:700}
/* desempenho por matéria */
.hl{display:flex;gap:16px;align-items:center;padding:20px;border-radius:26px;border:1px solid var(--line);background:var(--card)}
.hl.good{border-color:rgba(34,197,94,.5);background:radial-gradient(120% 100% at 50% 140%,rgba(34,197,94,.3),transparent 70%),var(--card)}
.hl.warn{border-color:rgba(245,158,11,.55);background:radial-gradient(120% 100% at 50% 140%,rgba(245,158,11,.28),transparent 70%),var(--card)}
.hl small{display:block;color:var(--mut);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.hl b{display:block;font-family:var(--hf);font-weight:400;font-size:22px;line-height:1.2}
.hl span{color:#a9b6d8;font-size:14px}.hl .fico{flex:none}
.grid2.hls{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sr{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.sr:last-child{border:0}
.sic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#07102b;border:1px solid rgba(140,175,255,.3)}.sic svg{width:22px;height:22px}
.sm{flex:1;min-width:0}.sn{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}
.sn span{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sn b{font-family:var(--hf);font-weight:400;font-size:18px}
.sm small{display:block;color:var(--mut);font-size:12.5px;margin-top:6px}
.bdg{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.bdg.good{background:var(--okbg);color:#4ade80;border:1px solid var(--ok2l)}.bdg.warn{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.5)}
.tr.g i{background:linear-gradient(90deg,#16a34a,#4ade80)}.tr.w i{background:linear-gradient(90deg,#d97706,#fbbf24)}
.sr.muted{opacity:.6}
@media(max-width:820px){.grid2.hls{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pcard{margin-bottom:18px}
.pban{height:170px;border-radius:28px;background:var(--glowbg);background-size:cover;background-position:center;border:1px solid var(--line)}
.phead{display:flex;align-items:flex-end;gap:16px;margin:-46px 0 0 22px;position:relative}.phead h1{margin:0}

⁻¹(8)?", ["27", "32", "37", "40", "43"], "C", "x = (y+3)/5 → y = 5x − 3. Então f⁻¹(8) = 40 − 3 = 37.", ""], ["Qual função é inversa de f(x)=2x+1?", ["2x−1", "(x+1)/2", "(x−1)/2", "x/2+1", "1/(2x+1)"], "C", "f(g(x)) = 2·(x−1)/2 + 1 = x e g(f(x)) = (2x+1−1)/2 = x. Como as duas compostas dão x, são inversas.", ""], ["Determine f⁻¹(x) para f(x)=(3x−2)/(x+4).", ["(4x+2)/(3−x)", "(2+4x)/(3−x)", "(3x−2)/(x+4)", "(4x−2)/(x+3)", "(x+4)/(3x−2)"], "AB", "x = (3y−2)/(y+4) → xy + 4x = 3y − 2 → y(x−3) = −2−4x → y = (4x+2)/(3−x). O denominador não pode ser zero, então x ≠ 3. As alternativas A e B são a mesma expressão, então as duas valem.", ""], ["Uma função transforma x em 7x−5. Qual entrada produz 30?", ["3", "4", "5", "6", "7"], "C", "A inversa é f⁻¹(x) = (x+5)/7. Então f⁻¹(30) = 35/7 = 5.", ""]]], ["Função quadrática", [["Observe o gráfico. As interseções da parábola com o eixo x indicam as raízes. Quais são elas?", ["0 e 3", "1 e 3", "−1 e 3", "1 e 4", "2 e 3"], "B", "As raízes são os pontos onde a parábola cruza o eixo x: x = 1 e x = 3.", "<svg viewBox=\"0 0 220 180\" fill=\"currentColor\"><path d=\"M10 120H210M40 10V175\" stroke=\"currentColor\" stroke-opacity=\".5\"/><path d=\"M40 30Q100 270 160 30\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"3\"/><circle cx=\"70\" cy=\"120\" r=\"5\" fill=\"#7aa5ff\"/><circle cx=\"130\" cy=\"120\" r=\"5\" fill=\"#7aa5ff\"/><text x=\"70\" y=\"136\" font-size=\"11\" text-anchor=\"middle\">1</text><text x=\"100\" y=\"136\" font-size=\"11\" text-anchor=\"middle\">2</text><text x=\"130\" y=\"136\" font-size=\"11\" text-anchor=\"middle\">3</text><text x=\"160\" y=\"136\" font-size=\"11\" text-anchor=\"middle\">4</text><g font-size=\"12\"><text x=\"62\" y=\"108\">R1</text><text x=\"122\" y=\"108\">R2</text><text x=\"200\" y=\"114\">x</text><text x=\"46\" y=\"16\">y</text></g></svg>"], ["Para f(x)=x²−6x+5, qual é o vértice?", ["(2,−3)", "(3,−4)", "(3,4)", "(6,5)", "(−3,−4)"], "B", "Δ = 36−20 = 16, x = (6±4)/2 = 5 ou 1. xv = −b/2a = 3 e yv = 9−18+5 = −4. O eixo é a reta x = xv.", ""], ["Para f(x)=−2x²+8x+10, qual é o valor máximo?", ["10", "16", "18", "20", "22"], "C", "Como a < 0, a parábola tem máximo. xv = −8/(−4) = 2 e f(2) = −8 + 16 + 10 = 18.", ""], ["Uma função quadrática possui raízes 2 e 5 e coeficiente de x² igual a 1. Qual é sua lei?", ["x²+7x+10", "x²−7x+10", "x²−3x+10", "x²+3x−10", "x²−10x+7"], "B", "Forma fatorada: (x−2)(x−5) = x² − 5x − 2x + 10 = x² − 7x + 10.", ""], ["A altura de uma bola é h(t)=−5t²+20t+1. Em que instante ela atinge a altura máxima?", ["1 s", "2 s", "3 s", "4 s", "5 s"], "B", "tv = −20/(−10) = 2 s. h(2) = −20 + 40 + 1 = 21 m.", ""]]], ["Função composta", [["Se f(x)=2x+3 e g(x)=x²−1, determine (f∘g)(x).", ["2x²−1", "2x²+1", "x²+2", "2x²+3", "x²+1"], "B", "(f∘g)(x) = f(g(x)) = 2(x²−1) + 3 = 2x² − 2 + 3 = 2x² + 1.", ""], ["Se f(x)=x−4 e g(x)=3x+2, quanto vale (g∘f)(5)?", ["3", "5", "7", "9", "11"], "B", "f(5) = 1 e g(1) = 3·1 + 2 = 5. (O gabarito do PDF marca 7, mas o correto é 5.)", ""], ["Dadas f(x)=x²+2 e g(x)=2x−1, determine (f∘g)(x).", ["2x²−1", "4x²−4x+3", "4x²+2", "x²−2x+3", "2x²−2x+2"], "B", "f(g(x)) = (2x−1)² + 2 = 4x² − 4x + 3. g(f(x)) = 2(x²+2) − 1 = 2x² + 3.", ""], ["Se f(x)=3x−2 e g(x)=(x+2)/3, calcule (f∘g)(10).", ["8", "9", "10", "11", "12"], "C", "g(10) = 4 e f(4) = 12 − 2 = 10. Como f(g(x)) = x, uma desfaz a outra: são inversas.", ""], ["Uma máquina transforma x em 4x−1 e depois eleva o resultado ao quadrado. Qual é a função final?", ["(4x−1)²", "4x²−1", "(4x)²−1", "4x²−2x+1", "(x−1)⁴"], "A", "Primeiro 4x−1, depois ao quadrado: h(x) = (4x−1)². Para x=3: (12−1)² = 11² = 121.", ""]]], ["Médias", [["Calcule a média aritmética de 6, 7, 8, 9 e 10.", ["7", "8", "8,5", "9", "10"], "B", "Soma = 40; 40 ÷ 5 = 8.", ""], ["As notas de um aluno são 5, 7, 8 e 10. Qual é a média aritmética?", ["6,5", "7", "7,5", "8", "8,5"], "C", "Soma = 5+7+8+10 = 30; 30 ÷ 4 = 7,5.", ""], ["Calcule a média ponderada de 7, 8 e 9, com pesos 2, 3 e 5.", ["7,8", "8,0", "8,2", "8,3", "8,5"], "D", "(7·2 + 8·3 + 9·5)/(2+3+5) = (14+24+45)/10 = 83/10 = 8,3.", ""], ["Um aluno tirou 6 (peso 2), 8 (peso 1) e 9 (peso 3). Qual é a média ponderada?", ["7,0", "7,5", "8,0", "8,5", "9,0"], "C", "(6·2 + 8·1 + 9·3)/(2+1+3) = 47/6 ≈ 7,83. A alternativa mais próxima é 8,0, a do gabarito.", ""], ["Calcule a média geométrica entre 4 e 25.", ["8", "9", "10", "12", "14"], "C", "√(4·25) = √100 = 10.", ""], ["Qual é a média geométrica de 2, 8 e 32?", ["4", "6", "8", "10", "12"], "C", "Com 3 números, usa-se a raiz cúbica: ∛(2·8·32) = ∛512 = 8.", ""], ["Calcule a média harmônica entre 6 e 12.", ["7", "8", "9", "10", "12"], "B", "MH = 2ab/(a+b) = 2·6·12/18 = 144/18 = 8. (O gabarito do PDF marca 9, mas o correto é 8.)", ""], ["Dois ciclistas percorrem a mesma distância, a 30 km/h e 60 km/h. Qual é a média harmônica?", ["30 km/h", "35 km/h", "40 km/h", "45 km/h", "50 km/h"], "C", "MH = 2·30·60/(30+60) = 3600/90 = 40 km/h. Para a mesma distância, a média harmônica é a velocidade média correta.", ""]]], ["Progressão aritmética", [["Observe a PA representada. A sequência começa em 2 e tem razão 3. Qual é o 20º termo?", ["55", "58", "59", "60", "62"], "C", "Com r = 3: a20 = 2 + 19·3 = 59. (O gabarito do PDF marca 60, mas o correto é 59.)", "<svg viewBox=\"0 0 310 80\" fill=\"currentColor\"><circle cx=\"30\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"30\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">2</text><circle cx=\"85\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"85\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">5</text><circle cx=\"140\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"140\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">8</text><circle cx=\"195\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"195\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">11</text><circle cx=\"250\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"250\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">14</text><circle cx=\"305\" cy=\"45\" r=\"19\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"2\"/><text x=\"305\" y=\"50\" text-anchor=\"middle\" font-size=\"14\">17</text><text x=\"57\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7aa5ff\">+3</text><text x=\"112\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7aa5ff\">+3</text><text x=\"167\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7aa5ff\">+3</text><text x=\"222\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7aa5ff\">+3</text><text x=\"277\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#7aa5ff\">+3</text></svg>"], ["Em uma PA, a₁=12 e a razão é −3. Qual é o 15º termo?", ["−27", "−30", "−33", "−36", "−39"], "B", "a15 = 12 + 14·(−3) = 12 − 42 = −30.", ""], ["Qual é a soma dos 30 primeiros termos da PA (2, 5, 8, 11, ...)?", ["1305", "1350", "1365", "1395", "1425"], "C", "r = 3, a30 = 2 + 29·3 = 89. S = (a1+an)·n/2 = (2+89)·30/2 = 1.365.", ""], ["Em uma PA, a₅=17 e a₁₂=45. Qual é o primeiro termo?", ["−3", "0", "1", "2", "5"], "C", "a12 − a5 = 7r = 28, então r = 4. a1 = a5 − 4r = 17 − 16 = 1.", ""], ["Uma pessoa economiza R$ 20 no primeiro mês e aumenta R$ 15 por mês. Quanto economiza ao todo em 12 meses?", ["R$ 1.080", "R$ 1.170", "R$ 1.230", "R$ 1.260", "R$ 1.320"], "C", "É uma PA com a1 = 20 e r = 15. a12 = 20 + 11·15 = 185. S = (20+185)·12/2 = 1.230.", ""]]], ["Polígonos", [["Observe o decágono regular. Qual é a soma de seus ângulos internos?", ["1080°", "1260°", "1440°", "1620°", "1800°"], "C", "S = (n−2)·180° = 8·180° = 1.440°.", "<svg viewBox=\"0 0 180 180\"><polygon points=\"90.0,20.0 131.1,33.4 156.6,68.4 156.6,111.6 131.1,146.6 90.0,160.0 48.9,146.6 23.4,111.6 23.4,68.4 48.9,33.4\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"3\"/></svg>"], ["Um polígono regular possui 12 lados. Qual é a medida de cada ângulo interno?", ["120°", "135°", "150°", "160°", "165°"], "C", "S = 10·180° = 1.800°. Cada ângulo: 1.800° ÷ 12 = 150°.", ""], ["Quantas diagonais possui um polígono de 15 lados?", ["75", "90", "105", "120", "135"], "B", "d = n(n−3)/2 = 15·12/2 = 90.", ""], ["Um polígono possui soma dos ângulos internos igual a 1800°. Quantos lados ele possui?", ["10", "11", "12", "13", "14"], "C", "(n−2)·180 = 1.800 → n − 2 = 10 → n = 12.", ""], ["Cada ângulo externo de um polígono regular mede 24°. Determine o número de lados.", ["12", "14", "15", "16", "18"], "C", "Soma dos externos = 360°, então n = 360/24 = 15. Interno = 180° − 24° = 156°.", ""]]], ["Circunferências", [["Observe a circunferência. O raio indicado mede 7 cm. Usando π=3,14, qual é o comprimento?", ["21,98 cm", "43,96 cm", "49 cm", "87,92 cm", "153,86 cm"], "B", "C = 2πr = 2·3,14·7 = 43,96 cm.", "<svg viewBox=\"0 0 180 180\" fill=\"currentColor\"><circle cx=\"90\" cy=\"90\" r=\"70\" fill=\"none\" stroke=\"#7aa5ff\" stroke-width=\"3\"/><path d=\"M90 90H160\" stroke=\"currentColor\" stroke-width=\"2\"/><circle cx=\"90\" cy=\"90\" r=\"3\"/><text x=\"102\" y=\"82\" font-size=\"13\">r = 7 cm</text></svg>"], ["Calcule a área de um círculo de raio 5 cm, usando π=3,14.", ["31,4 cm²", "50 cm²", "62,8 cm²", "78,5 cm²", "157 cm²"], "D", "A = πr² = 3,14·25 = 78,5 cm².", ""], ["Uma circunferência possui diâmetro de 18 cm. Qual é o raio?", ["6 cm", "8 cm", "9 cm", "12 cm", "18 cm"], "C", "Raio = 18/2 = 9 cm. C = 2·3,14·9 = 56,52 cm.", ""], ["Um setor circular possui raio 10 cm e ângulo central de 90°. Qual é a área? Use π=3,14.", ["25 cm²", "50 cm²", "78,5 cm²", "100 cm²", "314 cm²"], "C", "90° é 1/4 da volta. Área do círculo = 3,14·100 = 314; 314 ÷ 4 = 78,5 cm².", ""], ["Uma roda de bicicleta tem raio de 35 cm. Aproximadamente quantas voltas são necessárias para percorrer 220 m? Use π=22/7.", ["50", "75", "100", "125", "150"], "C", "C = 2·(22/7)·35 = 220 cm = 2,2 m. Voltas = 220 ÷ 2,2 = 100.", ""]]]], "materia": "Matemática", "pasta": "AP3, dia 8 — Matemática A, B e C"}, {"id": "td1", "titulo": "TD 1 — Função afim", "data": "Lista de estudos", "temas": [["Função afim", [["Se f(x) = 2x + 3, qual é o valor de f(5)?", ["10", "11", "12", "13", "15"], "D", "f(5) = 2·5 + 3 = 13. (O gabarito do PDF marca B, mas o correto é D.)", ""], ["A função f(x) = −3x + 12 é crescente ou decrescente?", ["Crescente", "Decrescente", "Constante", "Quadrática", "Não é função"], "B", "O coeficiente angular é −3 (negativo), então a função é decrescente.", ""], ["Uma função afim passa pelos pontos (1, 5) e (3, 11). Qual é sua lei?", ["f(x)=2x+3", "f(x)=3x+2", "f(x)=3x−2", "f(x)=4x+1", "f(x)=2x+1"], "B", "a = (11−5)/(3−1) = 3. Usando (1,5): 5 = 3 + b, logo b = 2.", ""], ["Determine a raiz de f(x) = 4x − 20.", ["−5", "0", "4", "5", "20"], "D", "4x − 20 = 0 → x = 5.", ""], ["Qual é o coeficiente angular da reta que passa por (2, 7) e (6, 15)?", ["1", "2", "3", "4", "5"], "B", "(15−7)/(6−2) = 8/4 = 2.", ""], ["O gráfico de uma função afim cruza o eixo y em 6 e tem coeficiente angular −2. Qual é a lei?", ["f(x)=2x+6", "f(x)=−2x+6", "f(x)=−2x−6", "f(x)=6x−2", "f(x)=2x−6"], "B", "Cruza o eixo y em 6 → b = 6; a = −2. Logo f(x) = −2x + 6.", ""], ["Se f(x)=5x−1, para qual x temos f(x)=24?", ["4", "5", "6", "23", "25"], "B", "5x − 1 = 24 → 5x = 25 → x = 5. (O gabarito do PDF marca C, mas o correto é B.)", ""], ["Uma corrida cobra taxa fixa de R$ 8 e mais R$ 3 por quilômetro. Qual função representa o preço P em função de x quilômetros?", ["P(x)=8x+3", "P(x)=3x+8", "P(x)=11x", "P(x)=8x−3", "P(x)=3x−8"], "B", "A taxa fixa é o termo constante e o valor por km multiplica x: P(x) = 3x + 8.", ""], ["Qual ponto pertence ao gráfico de f(x)=2x−4?", ["(1, −1)", "(2, 0)", "(3, 1)", "(4, 6)", "(0, 4)"], "B", "f(2) = 2·2 − 4 = 0, então (2, 0) pertence ao gráfico.", ""], ["Se f(x)=ax+2 e f(4)=14, qual é o valor de a?", ["2", "3", "4", "5", "6"], "B", "4a + 2 = 14 → 4a = 12 → a = 3.", ""]]]], "materia": "Matemática", "pasta": "AP3, dia 8 — Matemática A, B e C"}, {"id": "td2", "titulo": "TD 2 — Função inversa", "data": "Lista de estudos", "temas": [["Função inversa", [["Se f(x)=3x−6, qual é f⁻¹(x)?", ["3x+6", "(x+6)/3", "(x−6)/3", "3x−6", "x/3−6"], "B", "x = 3y − 6 → y = (x+6)/3.", ""], ["Se f(x)=2x+5, qual é f⁻¹(13)?", ["3", "4", "5", "6", "7"], "B", "f⁻¹(x) = (x−5)/2. Então f⁻¹(13) = 8/2 = 4. (O gabarito do PDF marca C, mas o correto é B.)", ""], ["A inversa de f(x)=(x−4)/3 é:", ["3x−4", "3x+4", "(x+4)/3", "(x−4)/3", "x/3−4"], "B", "x = (y−4)/3 → y = 3x + 4.", ""], ["Se f(x)=5x+1, então f⁻¹(x) é:", ["5x−1", "(x−1)/5", "(x+1)/5", "x/5+1", "1−5x"], "B", "x = 5y + 1 → y = (x−1)/5.", ""], ["Se f(7)=20 e f é bijetiva, então f⁻¹(20) é:", ["7", "13", "20", "27", "140"], "A", "A inversa desfaz a função: se f(7) = 20, então f⁻¹(20) = 7.", ""], ["A função f(x)=4x−9 tem inversa. Qual é f⁻¹(7)?", ["2", "3", "4", "7", "16"], "C", "f⁻¹(x) = (x+9)/4. Então f⁻¹(7) = 16/4 = 4. (O gabarito do PDF marca B, mas o correto é C.)", ""], ["Se f(x)=(x+2)/5, então f⁻¹(8) vale:", ["30", "38", "40", "42", "48"], "B", "f⁻¹(x) = 5x − 2. Então f⁻¹(8) = 40 − 2 = 38. (O gabarito do PDF marca D, mas o correto é B.)", ""], ["Qual função é a inversa de f(x)=(x+1)/2?", ["2x+1", "2x−1", "x/2+1", "(x−1)/2", "1−2x"], "B", "x = (y+1)/2 → y = 2x − 1.", ""], ["Se f(x)=(3x−2)/(x+4), então f⁻¹(x) é:", ["(x−2)/(3+x)", "(4x+2)/(3−x)", "(3x−2)/(x+4)", "(2−x)/(3+x)", "(x+4)/(3x−2)"], "B", "x = (3y−2)/(y+4) → xy + 4x = 3y − 2 → y(x−3) = −4x − 2 → y = (4x+2)/(3−x). (No PDF a alternativa B estava escrita como (x+2)/(3−x), que não é a inversa; corrigi.)", ""], ["Se f⁻¹(x)=2x−7, então f(5) é:", ["1", "2", "3", "4", "6"], "E", "f(5) = y significa f⁻¹(y) = 5: 2y − 7 = 5 → y = 6. (No PDF nenhuma alternativa estava certa; troquei a E por 6.)", ""]]]], "materia": "Matemática", "pasta": "AP3, dia 8 — Matemática A, B e C"}, {"id": "td3", "titulo": "TD 3 — Função quadrática", "data": "Lista de estudos", "temas": [["Função quadrática", [["As raízes de f(x)=x²−5x+6 são:", ["1 e 6", "2 e 3", "−2 e −3",  <div class="home-tools"><div class="quick"><div class="qtop"><div class="fico">${next?FOLD:HOME}</div><div><span class="home-kicker">Seu próximo passo</span><h3>${next?esc(next.titulo):"Tudo pronto para começar"}</h3><p>${nextText}</p></div></div><button class="next on" data-home-start="${nextN}">${nextTitle}</button></div><div class="quick"><div class="qtop"><div class="fico">${DASH}</div><div><span class="home-kicker">Desafio rápido</span><h3>Teste seus conhecimentos</h3><p>Abra uma prova surpresa e veja como está hoje.</p></div></div><button class="prev" data-home-start="${quickN}" ${quickN<0?"disabled":""}>Fazer desafio</button></div></div>
 <div class="grid2" style="margin-top:16px">${best}<div class="card" style="margin-top:0"><h3>Suas últimas notas</h3>${spark()||'<p class="sub" style="margin:0">Ainda sem notas.</p>'}</div></div>
 <div class="msg" style="--c:${col};margin-top:16px">${fr}</div></div>`;
 $.querySelectorAll("[data-home-start]").forEach(b=>b.onclick=()=>{const n=+b.dataset.homeStart;if(n>=0)start(n);else materias()});
}
function materias(){
 cur="__m";curP="";renderNav();
 $.innerHTML=`<div class="view wide"><h1>Matérias</h1><p class="sub">Escolha uma matéria para estudar.</p><div class="grid2">${allMats().map(m=>{const n=EXAMS.filter(e=>(e.materia||"Geral")===m).length;return `<button class="exam" data-m="${esc(m)}"><div class="fico">${ico(m)}</div><b>${esc(m)}</b><span>${n?n+(n>1?" provas":" prova"):"Em breve"}</span></button>`}).join("")}</div></div>`;

async function conta(){
 cur="__c";curP="";renderNav();
 if(!IMG_OK){$.innerHTML='<div class="view"><div class="ld"></div></div>';await loadImgs()}
 const E={foto:{src:PERFIL.foto||"",adj:PERFIL.foto_adj||null},banner:{src:PERFIL.banner||"",adj:PERFIL.banner_adj||null}};
 $.innerHTML=`<div class="view wide"><h1>Sua conta</h1><p class="sub">Edite seu nome, descrição, foto e banner. Depois, use o botão “Salvar alterações” lá embaixo.</p><p class="sub" style="margin-top:-8px">Seu código de amigo: <b>#${PERFIL.codigo||"—"}</b> · seu nome é único e ninguém mais pode usá-lo.</p>
 <div class="pcard"><div id="bp"></div><div class="phead"><div id="ap"></div></div></div>
 <div class="row wrap"><button class="prev" id="bb">Trocar banner</button><button class="prev" id="bj">Ajustar banner</button><button class="prev" id="ba">Trocar foto</button><button class="prev" id="bk2">Ajustar foto</button><button class="prev" id="br">Remover imagens</button></div>
 <p class="sub" style="font-size:13px;margin:0 0 4px">Dica: GIFs também funcionam (até 2 MB) e ficam animados.</p>
 <input type="file" id="fb" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.avif,.bmp,.svg,.heic,.heif" hidden><input type="file" id="fa" accept="image/*,.jpg,.jpeg,.png,.gif,.webp,.avif,.bmp,.svg,.heic,.heif" hidden>
 <label class="sub" for="nm">Nome</label><input id="nm" value="${escA(me.nome)}" maxlength="40">
 <label class="sub" for="ds">Descrição <span id="ct"></span></label><textarea id="ds" maxlength="160" placeholder="Fale um pouco sobre você (opcional)">${esc(PERFIL.descricao||"")}</textarea>
 <div class="sbar"><button class="next on" id="sv">Salvar alterações</button><span id="ms" class="sub"></span></div></div>`;
 const g=id=>document.getElementById(id),ds=g("ds");
 const draw=()=>{g("bp").outerHTML=bannerHtml(E.banner.src,E.banner.adj,"bp");g("ap").innerHTML=avatar(92,E.foto)};draw();
 const cnt2=()=>{g("ct").textContent=ds.value.length+"/160"};cnt2();ds.oninput=cnt2;
 const pick=(kind,max,btn,inp)=>{g(btn).onclick=()=>inp.click();inp.onchange=async()=>{const f=inp.files[0];inp.value="";if(!f)return;
  try{const ext=(f.name||"").toLowerCase();const isImage=f.type.startsWith("image/")||/\.(jpe?g|png|gif|webp|avif|bmp|svg|heic|heif)$/i.test(ext);if(!isImage)return alert("Escolha um arquivo de imagem.");let src;if(f.type==="image/gif"||/\.gif$/i.test(ext)){if(f.size>2097152)return alert("Esse GIF tem mais de 2 MB. Escolha um menor.");src=await readGif(f)}else src=await fit(f,max);
   E[kind]={src,adj:{z:1,x:0,y:0}};E.dirty=1;draw();ajustar(kind,E[kind],draw)}catch(e){alert("Não consegui ler essa imagem.")}}};
 pick("banner",1400,"bb",g("fb"));pick("foto",600,"ba",g("fa"));
 g("bj").onclick=()=>E.banner.src?ajustar("banner",E.banner,draw):alert("Escolha um banner primeiro.");
 g("bk2").onclick=()=>E.foto.src?ajustar("foto",E.foto,draw):alert("Escolha uma foto primeiro.");
 g("br").onclick=()=>{E.foto={src:"",adj:null};E.banner={src:"",adj:null};E.dirty=1;draw()};
 g("sv").onclick=async()=>{
  const nome=g("nm").value.trim()||me.nome,descricao=ds.value.trim().slice(0,160),ms=g("ms");ms.textContent="Salvando...";if(nome.length<3||nome.length>24){ms.textContent="O nome precisa ter de 3 a 24 caracteres.";return}
  const row={nome,descricao,foto_adj:E.foto.adj,banner_adj:E.banner.adj};if(IMG_OK||E.dirty){row.foto=E.foto.src;row.banner=E.banner.src}
  const r=await sb.from("perfil").upsert({user_id:me.id,...row});
  if(r.error){ms.textContent=r.error.code==="23505"?"Esse nome já está em uso. Escolha outro.":"Não consegui salvar: "+r.error.message;return}
  await sb.auth.updateUser({data:{nome}});
  PERFIL={...PERFIL,...row};if(E.dirty)IMG_OK=true;me.nome=nome;renderWho();ms.textContent="Alterações salvas!";
 };
}
let curP="";
const exs=(m,p)=>EXAMS.map((e,n)=>[e,n]).filter(x=>(x[0].materia||"Geral")===m&&(x[0].pasta||"")===p);
const card=([e,n])=>`<button class="exam" data-n="${n}"><b>${esc(e.titulo)}</b><span>${esc(e.data||"")} · ${cnt(e)}/${tot(e)} respondidas${AT.some(a=>a.exam_id===e.id)?" · concluído":""}</span></button>`;
function folder(m){
 cur=m;curP="";renderNav();
 const ps=[...new Set(EXAMS.filter(e=>(e.materia||"Geral")===m&&e.pasta).map(e=>e.pasta))];
 $.innerHTML=`<div class="view wide"><div class="crumb"><button class="back" id="bk">Matérias</button><span>›</span>${esc(m)}</div><h1>${esc(m)}</h1><p class="sub">Escolha uma pasta.</p><div class="grid2">${ps.map(p=>{const n=exs(m,p).length;return `<button class="exam" data-p="${esc(p)}"><div class="fico">${FOLD}</div><b>${esc(p)}</b><span>${n} ${n>1?"provas":"prova"}</span></button>`}).join("")}${exs(m,"").map(card).join("")}</div>${ps.length||exs(m,"").length?"":'<p class="sub">Ainda não há provas nesta matéria. Em breve!</p>'}</div>`;
 document.getElementById("bk").onclick=materias;
 $.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>sub(m,b.dataset.p));
 $.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
function sub(m,p){
 cur=m;curP=p;renderNav();
 $.innerHTML=`<div class="view wide"><div class="crumb"><button class="back" id="bk">Matérias</button><span>›</span><button class="back" id="b2">${esc(m)}</button><span>›</span>${esc(p)}</div><h1>${esc(p)}</h1><p class="sub">Escolha um TD ou uma prova para fazer.</p><div class="grid2">${exs(m,p).map(card).join("")}</div></div>`;
 document.getElementById("bk").onclick=materias;document.getElementById("b2").onclick=()=>folder(m);
 $.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
const up=()=>curP?sub(cur,curP):folder(cur);
function start(n){
 ex=EXAMS[n];if(!cnt(ex)&&!confirm("A nota desta prova é a da primeira vez que você fizer. Depois você pode refazer só para treinar, sem mudar a nota. Quer começar agora?"))return;prac=false;Q=[];ex.temas.forEach(t=>t[1].forEach(q=>Q.push({t:t[0],q})));
 ans=[];(PR[ex.id]||[]).forEach((v,k)=>{if(v!==null)ans[k]=v});seen=new Set();rec=false;
 const j=Q.findIndex((_,k)=>ans[k]===undefined);if(j<0){rec=true;return end()}
 i=j;pw=nAns()/Q.length*100;show();
}
const nAns=()=>ans.filter(x=>x!==undefined).length;
const pend=()=>Q.length-nAns();
const firstOpen=not=>Q.findIndex((_,n)=>n!==not&&ans[n]===undefined);
function nextLabel(){if(ans[i]===undefined)return "Pular questão";if(i<Q.length-1)return "Próxima questão";return firstOpen(-1)>=0?"Voltar às puladas":"Ver resultado"}
function go(){if(i<Q.length-1){i++;show();return}const j=firstOpen(i);if(j>=0){i=j;show()}else end()}
function mapHtml(){const p=pend();return `<details class="map"><summary>Todas as questões${p?` · ${p} sem resposta`:""}</summary><div class="grid">${Q.map((x,n)=>{const a=ans[n],K=keys(x.q);const c=n===i?"cur":a!==undefined?(K.includes(a)?"ok":"no"):seen.has(n)?"sk":"";return `<button class="chip ${c}" data-n="${n}">${n+1}</button>`}).join("")}</div></details>`}
function show(){
 const {t,q}=Q[i],K=keys(q),a=ans[i],done=a!==undefined;seen.add(i);
 const cls=k=>!done?"":k===a?(K.includes(a)?"ok":"no"):K.includes(k)?"rev":"dim";
 $.innerHTML=`<div class="view${done?" still":""}"><div class="top"><button class="back">‹ Voltar</button><div class="bar"><i style="width:${pw}%"></i></div><div class="cnt">${i+1}/${Q.length}</div></div>${prac?'<div class="prac">Modo treino · não altera sua nota</div>':""}
 <div class="tema">${esc(t)}</div><p class="q">${esc(q[0])}</p>${q[4]?`<div class="fig">${figHtml(q[4])}</div>`:""}
 ${q[1].map((o,k)=>`<button class="opt ${cls(k)}"${done?" disabled":""}><em>${L[k]}</em><span>${esc(o)}</span></button>`).join("")}
 <div class="exp${done?" on":""}"><div><div class="in"><b>Explicação</b>${esc(q[3])}</div></div></div>
 <div class="nav"><button class="prev"${i?"":" disabled"}>‹ Anterior</button><button class="next on${done?"":" skip"}">${nextLabel()}</button></div>${mapHtml()}</div>`;
 $.querySelector(".back").onclick=up;
 $.querySelector(".prev").onclick=()=>{i--;show()};
 $.querySelector(".next").onclick=go;
 $.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{i=+c.dataset.n;show()});
 $.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>answer(k));
 pw=nAns()/Q.length*100;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$.querySelector(".bar i");if(b)b.style.width=pw+"%"}));
 window.scrollTo(0,0);
}
function answer(k){
 const K=keys(Q[i].q),ok=K.includes(k);ans[i]=k;if(!prac)save();
 $.querySelectorAll(".opt").forEach((o,n)=>{o.disabled=true;o.classList.add(n===k?(ok?"ok":"no"):K.includes(n)?"rev":"dim")});
 pw=nAns()/Q.length*100;$.querySelector(".bar i").style.width=pw+"%";
 $.querySelector(".exp").classList.add("on");
 {const nb=$.querySelector(".next");nb.classList.remove("skip");nb.textContent=nextLabel()}
 setTimeout(()=>$.querySelector(".next").scrollIntoView({behavior:"smooth",block:"nearest"}),450);
}
function end(){
 const per={};let score=0;
 Q.forEach((x,n)=>{const ok=keys(x.q).includes(ans[n]);per[x.t]=per[x.t]||[0,0];per[x.t][1]++;if(ok){score++;per[x.t][0]++}});
 if(!rec&&!pend()&&!prac){rec=true;attempt(score)}
 const off=AT.find(a=>a.exam_id===ex.id),N0=Math.round(score/Q.length*100),T=N0>=75?["#22c55e",N0==100?"Perfeito! Você gabaritou o TD. Pode ir para a prova com confiança total.":"Mandou muito bem! Seu esforço está aparecendo. Revise os poucos erros e vá com confiança."]:N0>=50?["#facc15","Você está no caminho certo! Falta pouco. Revise as questões que errou e a próxima nota vai subir."]:["#ef4444","Não desanime! Todo mundo começa de algum lugar. Leia as explicações, tente de novo e você vai evoluir."];
 $.innerHTML=`<div class="view"><h1>${prac?"Resultado do treino":"Resultado"}</h1><p class="sub" style="margin:0">${prac?"Nota de treino":"Sua nota"}</p><div class="big" style="color:${T[0]}"><span id="nt">0</span><small>/100</small></div><p class="sub">Você acertou ${score} de ${Q.length} questões.${pend()?` ${pend()} ficaram sem resposta.`:""}</p><div class="msg" style="--c:${T[0]}">${T[1]}</div>
 <div class="sec">${Object.entries(per).map(([t,v])=>`<div><span>${esc(t)}</span><b>${v[0]}/${v[1]}</b></div>`).join("")}</div>
 ${pend()?'<button class="next on" id="op" style="margin:0 0 12px">Responder as puladas</button>':""}<button class="exam" id="rv" style="text-align:center">Revisar questões</button>
 <button class="next on" id="again" style="margin:0 0 12px">${prac?"Treinar de novo":"Refazer para treinar"}</button><p class="sub" style="font-size:14px;margin:0 0 16px">Refazer é só para treinar: a nota que vale é a da primeira vez${off&&prac?" ("+off.nota+"/100)":""} e não muda.</p><button class="exam" id="h" style="text-align:center">Escolher outra prova</button></div>`;
 document.getElementById("rv").onclick=()=>{i=0;show()};
 const op=document.getElementById("op");if(op)op.onclick=()=>{i=Q.findIndex((_,n)=>ans[n]===undefined);show()};
 const ag=document.getElementById("again");if(ag)ag.onclick=()=>{prac=true;i=0;ans=[];pw=0;seen=new Set();rec=true;show()};
 document.getElementById("h").onclick=up;
 {const N=Math.round(score/Q.length*100),el=document.getElementById("nt"),t0=performance.now();const f=t=>{const p=Math.min((t-t0)/900,1);el.textContent=Math.round(N*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
}

</script>
